name: Make_All
on: push
jobs:
  Make_All:
    runs-on: ubuntu-slim
    permissions:
      contents: write # needed to push a new tag
    steps:
      - uses: actions/checkout@v2
      
      - name: Build all
        run: |
          sudo chmod ugo+x corun.sh make.sh
          cat <<EOF | sudo tee /etc/apparmor.d/mybwrap
            include <tunables/global>
            $PWD/cache/container/coresys/bwrap {
              userns,
            }
          EOF
          sudo systemctl restart apparmor
          sudo ./corun.sh ./make.sh
        
      - name: Generate Tag
        id: generate_tag
        run: |
          TAG_PREFIX="v0.1"
          TAG_SUFFIX="$(git rev-parse HEAD)"
          NEW_TAG="${TAG_PREFIX}-${TAG_SUFFIX}"
          echo "Generated tag: $NEW_TAG"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
          # export the variable for next step
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_OUTPUT

      - run: echo "pushing artifact"
        id: push_artifact
      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{steps.generate_tag.outputs.NEW_TAG}}
          files: |
             build/adduco

